name: Tests

# Only the application sources, the test suite and this workflow itself can
# change behaviour, so documentation/release-only changes skip the test matrix.
on:
  push:
    paths:
      - "source/**"
      - "tests/**"
      - ".github/workflows/tests.yml"
      - "requirements.txt"
  pull_request:
    paths:
      - "source/**"
      - "tests/**"
      - ".github/workflows/tests.yml"
      - "requirements.txt"

permissions:
  contents: read

env:
  # The UI is Persian; force a UTF-8 stdio on every runner so shaped glyphs
  # survive the console (and the exe subprocess capture).
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r source/requirements.txt pytest

      - name: Run test suite
        run: python -m pytest tests -v

  exe-smoke:
    name: exe smoke (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r source/requirements.txt pytest pyinstaller

      # Deliberately built WITHOUT --uac-admin: the smoke test only needs the
      # console UI, and the real release workflow owns the elevated build.
      - name: Build test executable
        working-directory: source
        run: >
          python -m PyInstaller --onefile --console --name ag_test
          --hidden-import=packaging main.py

      - name: Verify built executable exists
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "source\dist\ag_test.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "PyInstaller did not produce $exe"
          }
          $size = (Get-Item -LiteralPath $exe).Length
          Write-Host "built $exe ($([math]::Round($size / 1MB, 1)) MB)"
          if ($size -lt 100KB) { throw "executable is suspiciously small: $size bytes" }

      - name: Run tests against the built executable
        env:
          AG_TEST_EXE: ${{ github.workspace }}\source\dist\ag_test.exe
        run: python -m pytest tests -v
