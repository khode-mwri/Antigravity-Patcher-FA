name: Build & Release Binaries

on:
  push:
    branches:
      - main
    paths:
      - "source/**"
      - ".github/workflows/release.yml"
    tags:
      - "v*"
  release:
    types:
      - published
      - created
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.3.8). Leave empty to auto-detect from source/patcher/constants.py"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os_name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: Windows (x64)
            runner: windows-latest
            artifact_name: Antigravity_Patcher_Windows.exe
          - os_name: Ubuntu Linux (x64)
            runner: ubuntu-latest
            artifact_name: Antigravity_Patcher_Linux
          - os_name: macOS (Universal2)
            runner: macos-latest
            artifact_name: Antigravity_Patcher_macOS

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "source/requirements.txt"

      - name: Ensure Universal2 Python on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          SO_FILE=$(python -c "import _struct; print(_struct.__file__)")
          ARCHS=$(lipo -archs "$SO_FILE")
          echo "Current Python _struct architectures: $ARCHS"
          if [[ "$ARCHS" != *"x86_64"* || "$ARCHS" != *"arm64"* ]]; then
            echo "Installing official python.org Universal2 Python 3.12..."
            curl -fsSL https://www.python.org/ftp/python/3.12.8/python-3.12.8-macos11.pkg -o /tmp/python.pkg
            sudo installer -pkg /tmp/python.pkg -target /
            sudo ln -sf /Library/Frameworks/Python.framework/Versions/3.12/bin/python3 /Library/Frameworks/Python.framework/Versions/3.12/bin/python
            echo "/Library/Frameworks/Python.framework/Versions/3.12/bin" >> "$GITHUB_PATH"
          fi

      - name: Install dependencies
        working-directory: source
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build Windows executable
        if: runner.os == 'Windows'
        working-directory: source
        shell: bash
        run: |
          python -m PyInstaller --onefile --uac-admin --icon=icon.ico --name="Antigravity_Patcher_Windows" --noupx --clean --version-file=version.txt \
            --hidden-import=packaging \
            --hidden-import=packaging.version \
            --hidden-import=packaging.specifiers \
            --hidden-import=packaging.requirements \
            main.py

      - name: Build Ubuntu Linux executable
        if: runner.os == 'Linux'
        working-directory: source
        shell: bash
        run: |
          python -m PyInstaller --onefile --clean --icon=icon.ico --name="Antigravity_Patcher_Linux" \
            --hidden-import=packaging \
            --hidden-import=packaging.version \
            --hidden-import=packaging.specifiers \
            --hidden-import=packaging.requirements \
            main.py
          chmod +x dist/Antigravity_Patcher_Linux

      - name: Build macOS Universal2 executable
        if: runner.os == 'macOS'
        working-directory: source
        shell: bash
        run: |
          python -m PyInstaller --onefile --clean --name="Antigravity_Patcher_macOS" --target-arch universal2 \
            --hidden-import=packaging \
            --hidden-import=packaging.version \
            --hidden-import=packaging.specifiers \
            --hidden-import=packaging.requirements \
            main.py
          chmod +x dist/Antigravity_Patcher_macOS
          codesign --force --sign - dist/Antigravity_Patcher_macOS
          echo "Verifying Universal2 binary architectures:"
          lipo -archs dist/Antigravity_Patcher_macOS

      - name: Upload compiled binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: source/dist/${{ matrix.artifact_name }}
          if-no-files-found: error

  release:
    name: Publish to GitHub Releases
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all compiled binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Prepare release metadata & SHA-256 checksums
        id: meta
        working-directory: release-assets
        shell: bash
        run: |
          chmod +x Antigravity_Patcher_Linux Antigravity_Patcher_macOS || true
          sha256sum Antigravity_Patcher_Windows.exe Antigravity_Patcher_Linux Antigravity_Patcher_macOS > SHA256SUMS.txt
          cat SHA256SUMS.txt

          VERSION=$(python3 -c "import re; content = open('../source/patcher/constants.py').read(); print(re.search(r'VERSION\s*=\s*[\"\']([^\"\']+)[\"\']', content).group(1))")
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create or Update GitHub Release (${{ steps.meta.outputs.tag }})
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Antigravity Patcher ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/Antigravity_Patcher_Windows.exe
            release-assets/Antigravity_Patcher_Linux
            release-assets/Antigravity_Patcher_macOS
            release-assets/SHA256SUMS.txt
          body: |
            ## 🚀 Antigravity Patcher ${{ steps.meta.outputs.tag }}

            ### 📦 دانلود نسخه‌های اجرایی مستقل (بدون نیاز به نصب پایتون)

            | سیستم‌عامل | معماری | فایل اجرایی | نحوه اجرا |
            |:---|:---:|:---|:---|
            | **Windows** | `x64` | `Antigravity_Patcher_Windows.exe` | اجرا با کلیک راست و `Run as administrator` (دارای UAC خودکار) |
            | **Ubuntu / Linux** | `x64` | `Antigravity_Patcher_Linux` | `chmod +x Antigravity_Patcher_Linux && sudo ./Antigravity_Patcher_Linux` |
            | **macOS** | `Universal2 (Intel + Apple Silicon)` | `Antigravity_Patcher_macOS` | `chmod +x Antigravity_Patcher_macOS && sudo ./Antigravity_Patcher_macOS` |

            ---
            🔐 فایل `SHA256SUMS.txt` جهت بررسی اصالت و سلامت باینری‌ها پیوست شده است.

      - name: Attach binaries to existing 'python' release (if present)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view python >/dev/null 2>&1; then
            echo "Uploading compiled binaries to existing 'python' release as well..."
            gh release upload python \
              release-assets/Antigravity_Patcher_Windows.exe \
              release-assets/Antigravity_Patcher_Linux \
              release-assets/Antigravity_Patcher_macOS \
              release-assets/SHA256SUMS.txt \
              --clobber
          fi
